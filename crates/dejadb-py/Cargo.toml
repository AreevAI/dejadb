[package]
name = "dejadb-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Python bindings for DejaDB, the embedded memory engine for AI agents."
readme = "README.md"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["memory", "python", "ai-agents", "llm", "bindings"]
categories = ["api-bindings"]
publish = false

[features]
# The postgres backend ships ON in the binding: it is a server-side surface,
# and `DejaDB("postgres://…?schema=<name>")` must work from a stock
# `pip install dejadb`. The dependency-light default stays with the `deja`
# CLI and the store crate.
default = ["postgres"]
postgres = ["dejadb-store/postgres"]

[lib]
name = "dejadb"
crate-type = ["cdylib"]

[dependencies]
dejadb-core = { path = "../dejadb-core", version = "1.2.0" }
dejadb-store = { path = "../dejadb-store", version = "1.2.0" }
dejadb-cal = { path = "../dejadb-cal", version = "1.2.0" }
dejadb-context = { path = "../dejadb-context", version = "1.2.0" }
deja-loop = { path = "../deja-loop" }
dejadb-loop = { path = "../dejadb-loop" }
dejadb-llm = { path = "../dejadb-llm" }
serde_json = "1"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
