[package]
name = "dejadb-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Backend-parameterized conformance suite for the DejaDB store (not published)."
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
postgres = ["dejadb-store/postgres"]

[dependencies]
dejadb-core = { path = "../dejadb-core" }
dejadb-store = { path = "../dejadb-store" }
tempfile = "3"
serde_json = "1"

[dev-dependencies]
# The CAL-over-backend smoke drives the full stack (executor -> facade ->
# store) against each backend.
dejadb-cal = { path = "../dejadb-cal" }
