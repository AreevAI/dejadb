[package]
name = "dejadb-waiser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "DejaDB substrate adapter for the Waiser engine: implements waiser::OmsSubstrate over DejaDbFacade so `deja waiser` runs against real .mg/Turso memory files."
readme = "README.md"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ai-agents", "memory", "waiser", "self-improvement", "dejadb"]
categories = ["algorithms"]

[dependencies]
waiser = { path = "../waiser", version = "1.0.0" }
dejadb-core = { path = "../dejadb-core", version = "1.0.0" }
dejadb-store = { path = "../dejadb-store", version = "1.0.0" }
dejadb-cal = { path = "../dejadb-cal", version = "1.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
