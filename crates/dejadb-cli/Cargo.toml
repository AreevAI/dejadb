[package]
name = "dejadb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Command-line interface for DejaDB, the embedded memory engine for AI agents."
readme = "README.md"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["memory", "cli", "ai-agents", "llm", "database"]
categories = ["command-line-utilities", "database-implementations"]

[[bin]]
name = "deja"
path = "src/main.rs"

[features]
# `deja --db postgres://…?schema=<name>` — the server-tier backend. Non-
# default: the published edge binary stays dependency-light.
postgres = ["dejadb-store/postgres"]

[dependencies]
dejadb-core = { path = "../dejadb-core", version = "1.2.0" }
dejadb-store = { path = "../dejadb-store", version = "1.2.0" }
dejadb-cal = { path = "../dejadb-cal", version = "1.2.0" }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zeroize = "1"
# Already in the lockfile via dejadb-core; adds no new package. Used to parse
# ISO-8601 transcript timestamps so capture-stop can pin created_at.
chrono = { version = "0.4", default-features = false, features = ["std"] }

dejadb-mcp = { path = "../dejadb-mcp", version = "1.2.0" }
dejadb-context = { path = "../dejadb-context", version = "1.2.0" }
dejadb-server = { path = "../dejadb-server", version = "1.2.0" }
deja-loop = { path = "../deja-loop", version = "1.2.0" }
dejadb-loop = { path = "../dejadb-loop", version = "1.2.0" }
dejadb-llm = { path = "../dejadb-llm", version = "1.2.0" }

[dev-dependencies]
tempfile = "3"
