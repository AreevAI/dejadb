[package]
name = "dejadb-loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "DejaDB substrate adapter for the Deja Loop engine: implements deja_loop::OmsSubstrate over DejaDbFacade so `deja loop` runs against real .mg/Turso memory files."
readme = "README.md"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ai-agents", "memory", "loop", "self-improvement", "dejadb"]
categories = ["algorithms"]

[dependencies]
deja-loop = { path = "../deja-loop", version = "1.2.0" }
dejadb-core = { path = "../dejadb-core", version = "1.2.0" }
dejadb-store = { path = "../dejadb-store", version = "1.2.0" }
dejadb-cal = { path = "../dejadb-cal", version = "1.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
